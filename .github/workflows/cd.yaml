name: Build and push Keycloak image

# Builds the theme JAR, bakes it into a custom Keycloak image, and pushes it to
# Docker Hub (creativefree/keycloak). Deployment is decoupled: bump the image
# tag in the portfolio-cluster GitOps repo when you want to roll it to prod.

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    KEYCLOAK_VERSION: "26.4.7"
    IMAGE: creativefree/keycloak

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Build the theme JAR (dist_keycloak/keycloak-theme-*.jar).
            # ubuntu-latest ships the JDK + Maven that keycloakify build needs.
            - uses: actions/setup-node@v4
            - uses: bahmutov/npm-install@v1
            - run: npm run build-keycloak-theme

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Generate build ID
              id: tag
              run: echo "build_id=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  build-args: |
                      KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}
                  tags: |
                      ${{ env.IMAGE }}:latest
                      ${{ env.IMAGE }}:${{ env.KEYCLOAK_VERSION }}-${{ steps.tag.outputs.build_id }}
